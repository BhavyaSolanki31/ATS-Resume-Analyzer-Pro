
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ATS Resume Analyzer Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="container">

<div class="card">
<h1>ATS Resume Analyzer Pro</h1>
<p>Upload PDF/DOCX Resume • Get ATS Score • Analysis • Suggestions</p>
</div>

<div class="card">
<div id="drop" class="drop">
<h2>☁️ Drop Resume Here or Click to Upload</h2>
<p>Supports PDF & DOCX</p>
<input id="fileInput" type="file" accept=".pdf,.docx" hidden>
</div>
<div id="fileBox" class="file"></div>
<br>
<button id="analyzeBtn" class="btn" disabled onclick="analyzeResume()">Analyze Resume</button>
</div>

<div id="results" class="hidden">
<div class="grid">
<div class="card">
<div id="score" class="score">0</div>
<h3 id="grade"></h3>
<p id="summary"></p>
</div>
<div class="card">
<h2>Recruiter Summary</h2>
<div id="recruiter"></div>
</div>
</div>

<div class="card">
<h2>Detailed Analysis</h2>
<div id="analysis"></div>
</div>

<div class="card">
<h2>Suggestions</h2>
<ul id="suggestions"></ul>
<h3 id="potential"></h3>
</div>
</div>

</div>
<script src="./script.js"></script>
</body>
</html>
